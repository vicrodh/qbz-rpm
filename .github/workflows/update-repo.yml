name: Publish RPM repository

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable QBZ release tag to publish (for example, v2.1.0)
        required: true
        type: string

concurrency:
  group: qbz-rpm-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Sign, index, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve and validate stable release
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-${DISPATCH_TAG:-}}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected an exact stable tag such as v2.1.0; got: ${tag:-<empty>}" >&2
            exit 1
          fi

          api_headers=(
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          release_json="$(curl --fail --silent --show-error --location \
            "${api_headers[@]}" \
            "https://api.github.com/repos/vicrodh/qbz/releases/tags/$tag")"
          if [[ "$(jq -r '.tag_name' <<<"$release_json")" != "$tag" ]] ||
             [[ "$(jq -r '.draft' <<<"$release_json")" != "false" ]] ||
             [[ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ]]; then
            echo "$tag is not a published stable QBZ release" >&2
            exit 1
          fi

          comparison_json="$(curl --fail --silent --show-error --location \
            "${api_headers[@]}" \
            "https://api.github.com/repos/vicrodh/qbz/compare/${tag}...main")"
          comparison="$(jq -r '.status' <<<"$comparison_json")"
          if [[ "$comparison" != "ahead" && "$comparison" != "identical" ]]; then
            echo "$tag does not resolve to an ancestor of vicrodh/qbz main" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install RPM repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes createrepo-c gnupg rpm

      - name: Wait for all release RPMs
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "QBZ-${VERSION}-1.x86_64.rpm"
            "QBZ-${VERSION}-1.aarch64.rpm"
            "qbzd-${VERSION}-1.x86_64.rpm"
            "qbzd-${VERSION}-1.aarch64.rpm"
          )

          mkdir staging
          for attempt in {1..60}; do
            missing=()
            for asset in "${assets[@]}"; do
              if [[ -f "staging/$asset" ]]; then
                continue
              fi

              asset_url="https://github.com/vicrodh/qbz/releases/download/${TAG}/${asset}"
              if curl --fail --silent --show-error --location \
                --output "staging/${asset}.part" "$asset_url"; then
                mv "staging/${asset}.part" "staging/$asset"
              else
                rm -f "staging/${asset}.part"
                missing+=("$asset")
              fi
            done

            if (( ${#missing[@]} == 0 )); then
              break
            fi
            if (( attempt == 60 )); then
              printf 'Timed out waiting for release asset: %s\n' "${missing[@]}" >&2
              exit 1
            fi

            printf 'Attempt %d/60; waiting for: %s\n' \
              "$attempt" "${missing[*]}"
            sleep 60
          done

      - name: Import repository signing key
        id: signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "GPG_PRIVATE_KEY is not configured" >&2
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

          mapfile -t fingerprints < <(
            gpg --batch --with-colons --list-secret-keys |
              awk -F: '$1 == "sec" { primary = 1; next }
                         primary && $1 == "fpr" { print $10; primary = 0 }'
          )
          if (( ${#fingerprints[@]} != 1 )); then
            echo "GPG_PRIVATE_KEY must contain exactly one primary secret key" >&2
            exit 1
          fi

          echo "fingerprint=${fingerprints[0]}" >> "$GITHUB_OUTPUT"

      - name: Build signed repository
        env:
          FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/build-repository.sh \
            "$VERSION" staging public "$FINGERPRINT"

          install -m 0644 index.html qbz.repo public/
          sed -i \
            "s/published with the first release/$FINGERPRINT/" \
            public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
